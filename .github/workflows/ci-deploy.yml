name: CI & Deploy

# Self-hosted runners + public repo: push/dispatch only, never pull_request,
# so a fork PR can never execute on our machines.
on:
  push:
    branches: [main]
    # A full run rebuilds two architectures and rolls production. Documentation
    # and agent-config changes must not cost that.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.claude/**'
  workflow_dispatch:

concurrency:
  group: crawl4ai-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: docker.iocloudhost.net/crawl4ai
  APPLICATION_ID: YTAj7y39GXOkUtoHpYYXw

jobs:
  test:
    runs-on: [self-hosted, Linux, X64, williamacallahan]
    steps:
      # persist-credentials:false — the runners are long-lived, so the default
      # would leave a usable GITHUB_TOKEN in .git/config after the job ends.
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Build test env
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv venv .venv
          # The docker-server deps are a PEP 735 [dependency-groups] entry, not an
          # optional-dependencies extra, so this is --group and not ".[server]".
          uv pip install -q --python .venv/bin/python -e . --group server pytest pytest-asyncio

      - name: Unit gate
        run: |
          PYTHONPATH="$PWD:$PWD/deploy/docker" .venv/bin/python -m pytest -q --no-header \
            deploy/docker/tests/test_auth.py \
            deploy/docker/tests/test_crawl_job_queue.py \
            deploy/docker/tests/test_crawl_job_contract.py \
            deploy/docker/tests/test_resource_policy.py \
            tests/test_memory_cgroup.py

  # Each architecture builds on a runner of that architecture. QEMU emulation is
  # NOT viable here: the Dockerfile launches Chromium as a build-time smoke test
  # and emulated Chromium dies with SIGSEGV.
  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner_arch: X64
          - arch: arm64
            runner_arch: ARM64
    runs-on: [self-hosted, Linux, "${{ matrix.runner_arch }}", williamacallahan]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # Secrets arrive via env, never interpolated into the shell line, so they
      # cannot land in the command string or a trace.
      - name: Registry login
        env:
          REGISTRY_USER: ${{ secrets.NEXUS_DOCKER_USERNAME }}
          REGISTRY_PASS: ${{ secrets.NEXUS_DOCKER_PASSWORD }}
        run: printf '%s' "$REGISTRY_PASS" | docker login docker.iocloudhost.net -u "$REGISTRY_USER" --password-stdin

      # --provenance/--sbom off: with attestations the result is an OCI index,
      # and `docker manifest create` refuses to nest one index inside another,
      # which silently drops the arch from the final list.
      - name: Build and push ${{ matrix.arch }}
        env:
          GIT_SHA: ${{ github.sha }}
          ARCH: ${{ matrix.arch }}
        run: |
          # Read the version from the package instead of hardcoding it. A literal
          # here goes stale on every release bump and silently mislabels the image.
          C4AI_VER=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' crawl4ai/__version__.py)
          test -n "$C4AI_VER"
          echo "building C4AI_VER=${C4AI_VER}"
          docker build --provenance=false --sbom=false \
            --build-arg "C4AI_VER=${C4AI_VER}" \
            --build-arg "C4AI_GIT_SHA=${GIT_SHA}" \
            --build-arg "SOURCE_COMMIT=${GIT_SHA}" \
            --build-arg INSTALL_TYPE=default \
            --build-arg ENABLE_GPU=false \
            -t "${IMAGE}:${GIT_SHA}-${ARCH}" .
          # Nexus 504s on the ~1GB Chromium layer often enough to matter, mostly
          # from the arm64 node. Already-uploaded layers are skipped on retry.
          for attempt in 1 2 3; do
            if docker push "${IMAGE}:${GIT_SHA}-${ARCH}"; then exit 0; fi
            echo "push attempt ${attempt} failed; retrying"
            sleep 20
          done
          echo "push failed after 3 attempts"; exit 1

      # The runners are long-lived and shared; without this the Nexus credential
      # stays in ~/.docker/config.json for whatever job lands here next.
      - name: Drop registry credentials
        if: always()
        run: docker logout docker.iocloudhost.net || true

      # Every run left a multi-GB Chromium image and its cache on the runner and
      # nothing ever removed them, so haiku-18 eventually died mid-apt with
      # "No space left on device". This is a separate step on purpose: the push
      # loop above ends in `exit 0`, so anything appended to that script would
      # never run on success.
      - name: Reclaim build disk
        if: always()
        run: |
          # Scoped to this repo's own tags. These runners share their Docker
          # daemon with Coolify, so `docker system prune -a` would delete
          # co-tenant images. Docker refuses to remove an image backing a
          # running container, so an in-use tag fails harmlessly here.
          docker images --filter=reference="${IMAGE}:*" --format '{{.Repository}}:{{.Tag}}' \
            | xargs -r docker rmi || true
          # Cache older than the window only. Pruning all of it would make every
          # build reinstall Chromium cold.
          docker builder prune -f --filter until=72h || true
          df -h /

  merge:
    needs: build
    runs-on: [self-hosted, Linux, X64, williamacallahan]
    steps:
      - name: Registry login
        env:
          REGISTRY_USER: ${{ secrets.NEXUS_DOCKER_USERNAME }}
          REGISTRY_PASS: ${{ secrets.NEXUS_DOCKER_PASSWORD }}
        run: printf '%s' "$REGISTRY_PASS" | docker login docker.iocloudhost.net -u "$REGISTRY_USER" --password-stdin

      - name: Publish multi-arch manifest
        env:
          GIT_SHA: ${{ github.sha }}
        run: |
          docker manifest rm "${IMAGE}:${GIT_SHA}" 2>/dev/null || true
          docker manifest create "${IMAGE}:${GIT_SHA}" \
            "${IMAGE}:${GIT_SHA}-amd64" "${IMAGE}:${GIT_SHA}-arm64"
          docker manifest push "${IMAGE}:${GIT_SHA}"

      # A single-arch list would schedule fine and then sit Pending forever on
      # the arm64 swarm node, so fail loudly here instead.
      - name: Assert both architectures published
        env:
          GIT_SHA: ${{ github.sha }}
        run: |
          docker manifest inspect "${IMAGE}:${GIT_SHA}" \
            | python3 -c 'import json,sys; a={m["platform"]["architecture"] for m in json.load(sys.stdin)["manifests"]}; print("published:",a); sys.exit(0 if {"amd64","arm64"} <= a else 1)'

      - name: Drop registry credentials
        if: always()
        run: docker logout docker.iocloudhost.net || true

  deploy:
    needs: merge
    runs-on: [self-hosted, Linux, X64, williamacallahan]
    steps:
      - name: Point Dokploy at the new image and deploy
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          GIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          curl -fsS -X POST "$DOKPLOY_URL/api/application.update" \
            -H "x-api-key: $DOKPLOY_API_KEY" -H 'content-type: application/json' \
            --data "$(printf '{"applicationId":"%s","dockerImage":"%s:%s"}' "$APPLICATION_ID" "$IMAGE" "$GIT_SHA")" >/dev/null
          curl -fsS -X POST "$DOKPLOY_URL/api/application.deploy" \
            -H "x-api-key: $DOKPLOY_API_KEY" -H 'content-type: application/json' \
            --data "$(printf '{"applicationId":"%s"}' "$APPLICATION_ID")" >/dev/null
          echo "deploy queued for ${IMAGE}:${GIT_SHA}"

      # Health alone is not a rollout gate: the previous replicas keep answering
      # /health throughout, so a failed deploy would look green. Wait on Dokploy's
      # own deployment status first, then confirm the endpoint still serves.
      - name: Wait for the rollout to finish
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
        run: |
          set -euo pipefail
          for i in $(seq 1 40); do
            STATUS=$(curl -fsS "$DOKPLOY_URL/api/deployment.all?applicationId=${APPLICATION_ID}" \
              -H "x-api-key: $DOKPLOY_API_KEY" \
              | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d[0]["status"] if d else "none")')
            case "$STATUS" in
              done)    echo "rollout done after $((i*15))s"; break ;;
              error)   echo "Dokploy reported a failed deployment"; exit 1 ;;
              *)       sleep 15 ;;
            esac
            if [ "$i" -eq 40 ]; then echo "rollout did not finish within 10 minutes"; exit 1; fi
          done
          curl -fsS --max-time 15 https://crawl4ai.haiku.host/health >/dev/null
          echo "endpoint healthy"
