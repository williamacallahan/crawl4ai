[supervisord]
nodaemon=true                   ; Run supervisord in the foreground
logfile=/dev/null               ; Log supervisord output to stdout/stderr
logfile_maxbytes=0

[program:redis]
; When REDIS_HOST points at an external Redis (e.g. a compose sidecar), the
; embedded server stays off so the container writes no local Redis state.
command=/bin/sh -c 'if [ -n "%(ENV_REDIS_HOST)s" ] && [ "%(ENV_REDIS_HOST)s" != "localhost" ] && [ "%(ENV_REDIS_HOST)s" != "127.0.0.1" ]; then echo "External Redis at %(ENV_REDIS_HOST)s; embedded redis-server disabled."; exec sleep infinity; fi; exec /usr/bin/redis-server --dir /var/lib/redis --appendonly yes --appendfsync always --loglevel notice'
user=appuser                    ; Run redis as our non-root user
autorestart=true
priority=10
stdout_logfile=/dev/stdout      ; Redirect redis stdout to container stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr      ; Redirect redis stderr to container stderr
stderr_logfile_maxbytes=0

[program:crawl-job-worker]
command=/usr/local/bin/python /app/crawl_job_worker.py
directory=/app
user=appuser
numprocs=2
process_name=%(program_name)s_%(process_num)02d
autorestart=true
priority=30
stopsignal=TERM
stopasgroup=true
killasgroup=true
environment=PYTHONUNBUFFERED=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:gunicorn]
command=/usr/local/bin/gunicorn --bind [::]:11235 --workers 4 --timeout 1800 --graceful-timeout 30 --keep-alive 300 --log-level info --worker-class uvicorn.workers.UvicornWorker server:app
directory=/app                  ; Working directory for the app
user=appuser                    ; Run gunicorn as our non-root user
autorestart=true
priority=20
environment=PYTHONUNBUFFERED=1  ; Ensure Python output is sent straight to logs
stdout_logfile=/dev/stdout      ; Redirect gunicorn stdout to container stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr      ; Redirect gunicorn stderr to container stderr
stderr_logfile_maxbytes=0

# Optional: Add filebeat or other logging agents here if needed
