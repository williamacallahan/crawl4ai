name: CI & Deploy

# Self-hosted runners + public repo: push/dispatch only, never pull_request,
# so a fork PR can never execute on our machines.
on:
  push:
    branches: [main]
    # A full run rebuilds two architectures and rolls production. Documentation
    # and agent-config changes must not cost that.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.claude/**'
      - '.github/workflows/runner-capacity-dogfood.yml'
      - '.github/workflows/ci-deploy.yml'
  workflow_dispatch:

concurrency:
  group: crawl4ai-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: docker.iocloudhost.net/crawl4ai
  INGRESS_IMAGE: docker.iocloudhost.net/crawl4ai-ingress
  APPLICATION_ID: YTAj7y39GXOkUtoHpYYXw
  APPLICATION_APP_NAME: crawl4ai-yq1svi
  INGRESS_APPLICATION_ID: QeMB9toEaBOtOszdinFuk
  INGRESS_APPLICATION_APP_NAME: app-override-1080p-application-wo4lq5
  REDIS_APPLICATION_ID: D5WPQqgJYaonrZ6Pth2Cy
  REDIS_APPLICATION_APP_NAME: crawl4ai-redis-8xt08u

jobs:
  test:
    runs-on: [self-hosted, Linux, X64, williamacallahan]
    steps:
      # persist-credentials:false — the runners are long-lived, so the default
      # would leave a usable GITHUB_TOKEN in .git/config after the job ends.
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Build test env
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv sync --locked --no-dev --group server --group test

      - name: Unit gate
        run: |
          redis_container="crawl4ai-ci-redis-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker run --rm --detach --name "$redis_container" \
            --network "container:$HOSTNAME" \
            docker.io/library/redis:7.4-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf >/dev/null
          trap 'docker rm --force "$redis_container" >/dev/null 2>&1 || true' EXIT
          REDIS_URL=redis://127.0.0.1:6379/0 \
          PYTHONPATH="$PWD:$PWD/deploy/docker" .venv/bin/python -m pytest -q --no-header \
            deploy/docker/tests/test_auth.py \
            deploy/docker/tests/test_crawl_hook_lifecycle.py \
            deploy/docker/tests/test_crawl_job_queue.py \
            deploy/docker/tests/test_crawl_job_queue_redis.py \
            deploy/docker/tests/test_crawl_job_contract.py \
            deploy/docker/tests/test_readiness_routing.py \
            deploy/docker/tests/test_rollout_verifier.py \
            deploy/docker/tests/test_runtime_ui_repairs.py \
            deploy/docker/tests/test_security_headers_xss.py \
            deploy/docker/tests/test_server_crawler_defaults.py \
            deploy/docker/tests/test_resource_policy.py \
            tests/test_async_logger_stderr.py \
            tests/test_crawl_failure_severity.py \
            tests/test_memory_cgroup.py

  # Each architecture builds on a runner of that architecture. QEMU emulation is
  # NOT viable here: the Dockerfile launches Chromium as a build-time smoke test
  # and emulated Chromium dies with SIGSEGV.
  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner_arch: X64
          - arch: arm64
            runner_arch: ARM64
    runs-on: [self-hosted, Linux, "${{ matrix.runner_arch }}", williamacallahan]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # Secrets arrive via env, never interpolated into the shell line, so they
      # cannot land in the command string or a trace.
      - name: Registry login
        env:
          REGISTRY_USER: ${{ secrets.NEXUS_DOCKER_USERNAME }}
          REGISTRY_PASS: ${{ secrets.NEXUS_DOCKER_PASSWORD }}
        run: printf '%s' "$REGISTRY_PASS" | docker login docker.iocloudhost.net -u "$REGISTRY_USER" --password-stdin

      # --provenance/--sbom off: with attestations the result is an OCI index,
      # and `docker manifest create` refuses to nest one index inside another,
      # which silently drops the arch from the final list.
      - name: Build and push ${{ matrix.arch }}
        env:
          GIT_SHA: ${{ github.sha }}
          ARCH: ${{ matrix.arch }}
        run: |
          reclaim_build_disk() {
            docker images --filter=reference="${IMAGE}:*" --format '{{.Repository}}:{{.Tag}}' \
              | xargs -r docker rmi || true
            docker images --filter=reference="${INGRESS_IMAGE}:*" --format '{{.Repository}}:{{.Tag}}' \
              | xargs -r docker rmi || true
            docker builder prune -af --filter until=10m || true
            df -h /
          }
          trap reclaim_build_disk EXIT
          # Long-lived runners can start a build with the prior run's image and
          # cache still present. Reclaim this repo's old bytes before Chromium
          # export needs the space; the EXIT trap performs the same cleanup after.
          reclaim_build_disk

          # Read the version from the package instead of hardcoding it. A literal
          # here goes stale on every release bump and silently mislabels the image.
          C4AI_VER=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' crawl4ai/__version__.py)
          test -n "$C4AI_VER"
          echo "building C4AI_VER=${C4AI_VER}"
          docker build --provenance=false --sbom=false \
            --build-arg "C4AI_VER=${C4AI_VER}" \
            --build-arg "C4AI_GIT_SHA=${GIT_SHA}" \
            --build-arg "SOURCE_COMMIT=${GIT_SHA}" \
            --build-arg INSTALL_TYPE=default \
            --build-arg ENABLE_GPU=false \
            -t "${IMAGE}:${GIT_SHA}-${ARCH}" .
          # Docker owns layer-transfer retries; surface its terminal failure.
          docker push "${IMAGE}:${GIT_SHA}-${ARCH}"
          INGRESS_TAG="config-$(sha256sum deploy/ingress/Dockerfile deploy/ingress/haproxy.cfg | sha256sum | cut -c1-16)"
          if ! docker manifest inspect "${INGRESS_IMAGE}:${INGRESS_TAG}-${ARCH}" >/dev/null 2>&1; then
            docker build --provenance=false --sbom=false \
              -f deploy/ingress/Dockerfile \
              -t "${INGRESS_IMAGE}:${INGRESS_TAG}-${ARCH}" .
            docker push "${INGRESS_IMAGE}:${INGRESS_TAG}-${ARCH}"
          fi

      # The runners are long-lived and shared; without this the Nexus credential
      # stays in ~/.docker/config.json for whatever job lands here next.
      - name: Drop registry credentials
        if: always()
        run: docker logout docker.iocloudhost.net || true

  merge:
    needs: build
    runs-on: [self-hosted, Linux, X64, williamacallahan]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Registry login
        env:
          REGISTRY_USER: ${{ secrets.NEXUS_DOCKER_USERNAME }}
          REGISTRY_PASS: ${{ secrets.NEXUS_DOCKER_PASSWORD }}
        run: printf '%s' "$REGISTRY_PASS" | docker login docker.iocloudhost.net -u "$REGISTRY_USER" --password-stdin

      - name: Publish multi-arch manifest
        env:
          GIT_SHA: ${{ github.sha }}
        run: |
          docker manifest rm "${IMAGE}:${GIT_SHA}" 2>/dev/null || true
          docker manifest create "${IMAGE}:${GIT_SHA}" \
            "${IMAGE}:${GIT_SHA}-amd64" "${IMAGE}:${GIT_SHA}-arm64"
          docker manifest push "${IMAGE}:${GIT_SHA}"
          INGRESS_TAG="config-$(sha256sum deploy/ingress/Dockerfile deploy/ingress/haproxy.cfg | sha256sum | cut -c1-16)"
          if ! docker manifest inspect "${INGRESS_IMAGE}:${INGRESS_TAG}" >/dev/null 2>&1; then
            docker manifest create "${INGRESS_IMAGE}:${INGRESS_TAG}" \
              "${INGRESS_IMAGE}:${INGRESS_TAG}-amd64" "${INGRESS_IMAGE}:${INGRESS_TAG}-arm64"
            docker manifest push "${INGRESS_IMAGE}:${INGRESS_TAG}"
          fi

      # A single-arch list would schedule fine and then sit Pending forever on
      # the arm64 swarm node, so fail loudly here instead.
      - name: Assert both architectures published
        env:
          GIT_SHA: ${{ github.sha }}
        run: |
          docker manifest inspect "${IMAGE}:${GIT_SHA}" \
            | python3 -c 'import json,sys; a={m["platform"]["architecture"] for m in json.load(sys.stdin)["manifests"]}; print("published:",a); sys.exit(0 if {"amd64","arm64"} <= a else 1)'
          INGRESS_TAG="config-$(sha256sum deploy/ingress/Dockerfile deploy/ingress/haproxy.cfg | sha256sum | cut -c1-16)"
          docker manifest inspect "${INGRESS_IMAGE}:${INGRESS_TAG}" \
            | python3 -c 'import json,sys; a={m["platform"]["architecture"] for m in json.load(sys.stdin)["manifests"]}; print("ingress published:",a); sys.exit(0 if {"amd64","arm64"} <= a else 1)'

      - name: Drop registry credentials
        if: always()
        run: docker logout docker.iocloudhost.net || true

  deploy:
    needs: merge
    runs-on: [self-hosted, Linux, X64, williamacallahan, canonical-haiku-0]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Deploy through readiness-aware task routing
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
        run: |
          set -euo pipefail
          INGRESS_TAG="config-$(sha256sum deploy/ingress/Dockerfile deploy/ingress/haproxy.cfg | sha256sum | cut -c1-16)"
          export INGRESS_TAG
          export ROLLOUT_MONITOR_PATH="$RUNNER_TEMP/crawl4ai-rollout-monitor.jsonl"
          export ROLLOUT_MONITOR_ARMED_PATH="$RUNNER_TEMP/crawl4ai-rollout-monitor.armed"
          export ROLLOUT_MONITOR_STOP_PATH="$RUNNER_TEMP/crawl4ai-rollout-monitor.stop"
          MONITOR_PID=""
          start_monitor() {
            rm -f "$ROLLOUT_MONITOR_PATH" "$ROLLOUT_MONITOR_ARMED_PATH" "$ROLLOUT_MONITOR_STOP_PATH"
            python3 deploy/docker/readiness_routing.py monitor &
            MONITOR_PID=$!
            trap finish_monitor EXIT
            for _ in {1..30}; do
              test -f "$ROLLOUT_MONITOR_ARMED_PATH" && break
              kill -0 "$MONITOR_PID"
              sleep 1
            done
            test -f "$ROLLOUT_MONITOR_ARMED_PATH"
          }
          finish_monitor() {
            test -n "$MONITOR_PID" || return 0
            touch "$ROLLOUT_MONITOR_STOP_PATH"
            monitor_status=0
            wait "$MONITOR_PID" || monitor_status=$?
            MONITOR_PID=""
            return "$monitor_status"
          }
          # The ingress shares haiku-0's singleton Traefik failure domain.
          # Source drift performs its monitored cutover HERE, before the
          # zero-tolerance public monitor is armed: replacing the single-replica
          # ingress (stop-first) interrupts public traffic for a few seconds,
          # which must never count against the crawler rollout. The
          # readiness_routing.py ingress proof below polls the Dokploy
          # deployment to done and holds the exact-image invariant.
          LIVE_INGRESS_IMAGE="$(docker service inspect "$INGRESS_APPLICATION_APP_NAME" --format '{{.Spec.TaskTemplate.ContainerSpec.Image}}' 2>/dev/null | cut -d@ -f1 || true)"
          if [ "$LIVE_INGRESS_IMAGE" != "${INGRESS_IMAGE}:${INGRESS_TAG}" ]; then
            printf 'header = "x-api-key: %s"\n' "$DOKPLOY_API_KEY" | curl -fsS --connect-timeout 5 --max-time 15 --max-filesize 65536 --config - \
              -X POST "$DOKPLOY_URL/api/application.update" \
              -H 'content-type: application/json' \
              --data "$(printf '{"applicationId":"%s","sourceType":"docker","dockerImage":"%s:%s","registryId":"svxwBOnKPT8f476w2I77n","replicas":1,"labelsSwarm":{"otel.logs.enabled":"true","otel.service.name":"crawl4ai-ingress","otel.deployment.environment.name":"production","otel.service.version":"%s"},"healthCheckSwarm":{"Test":["CMD","haproxy","-c","-f","/usr/local/etc/haproxy/haproxy.cfg"],"Interval":1000000000,"Timeout":1000000000,"StartPeriod":5000000000,"Retries":3},"placementSwarm":{"Constraints":["node.hostname==haiku-0"],"MaxReplicas":1},"updateConfigSwarm":{"Parallelism":1,"Delay":0,"FailureAction":"rollback","Monitor":30000000000,"MaxFailureRatio":0,"Order":"stop-first"},"rollbackConfigSwarm":{"Parallelism":1,"Delay":0,"FailureAction":"pause","Monitor":30000000000,"MaxFailureRatio":0,"Order":"stop-first"}}' "$INGRESS_APPLICATION_ID" "$INGRESS_IMAGE" "$INGRESS_TAG" "$INGRESS_TAG")" >/dev/null
            printf 'header = "x-api-key: %s"\n' "$DOKPLOY_API_KEY" | curl -fsS --connect-timeout 5 --max-time 15 --max-filesize 65536 --config - \
              -X POST "$DOKPLOY_URL/api/application.deploy" \
              -H 'content-type: application/json' \
              --data "$(printf '{"applicationId":"%s"}' "$INGRESS_APPLICATION_ID")" >/dev/null
          fi
          python3 deploy/docker/readiness_routing.py ingress
          test -n "$MONITOR_PID" || start_monitor
          python3 deploy/docker/readiness_routing.py

          # Redis persistence: fsync-per-write blocked the single Redis thread on
          # disk stalls and 503'd every replica's /health at once (2026-08-28 task
          # kills). CI owns the record so verify_rollout's everysec invariant and
          # the deployed configuration cannot drift apart; the running service
          # picks the command up on its next redeploy.
          printf 'header = "x-api-key: %s"\n' "$DOKPLOY_API_KEY" | curl -fsS --connect-timeout 5 --max-time 15 --max-filesize 65536 --config - \
            -X POST "$DOKPLOY_URL/api/application.update" \
            -H 'content-type: application/json' \
            --data "$(printf '{"applicationId":"%s","command":"redis-server --dir /data --appendonly yes --appendfsync everysec --loglevel notice"}' "$REDIS_APPLICATION_ID")" >/dev/null

          printf 'header = "x-api-key: %s"\n' "$DOKPLOY_API_KEY" | curl -fsS --connect-timeout 5 --max-time 15 --max-filesize 65536 --config - \
            -X POST "$DOKPLOY_URL/api/application.update" \
            -H 'content-type: application/json' \
            --data "$(printf '{"applicationId":"%s","dockerImage":"%s:%s","replicas":3,"labelsSwarm":{"otel.logs.enabled":"true","otel.service.name":"crawl4ai","otel.deployment.environment.name":"production","otel.service.version":"%s"},"healthCheckSwarm":{"Test":["CMD","curl","-f","http://localhost:11235/health"],"Interval":10000000000,"Timeout":5000000000,"StartPeriod":120000000000,"Retries":5},"placementSwarm":{"MaxReplicas":1},"updateConfigSwarm":{"Parallelism":1,"Delay":0,"FailureAction":"rollback","Monitor":210000000000,"MaxFailureRatio":0,"Order":"start-first"},"rollbackConfigSwarm":{"Parallelism":1,"Delay":0,"FailureAction":"pause","Monitor":210000000000,"MaxFailureRatio":0,"Order":"start-first"}}' "$APPLICATION_ID" "$IMAGE" "$GITHUB_SHA" "$GITHUB_SHA")" >/dev/null
          printf 'header = "x-api-key: %s"\n' "$DOKPLOY_API_KEY" | curl -fsS --connect-timeout 5 --max-time 15 --max-filesize 65536 --config - \
            -X POST "$DOKPLOY_URL/api/application.deploy" \
            -H 'content-type: application/json' \
            --data "$(printf '{"applicationId":"%s"}' "$APPLICATION_ID")" >/dev/null
          python3 deploy/docker/verify_rollout.py
          python3 deploy/docker/readiness_routing.py ingress
          python3 deploy/docker/readiness_routing.py verify
          finish_monitor
          trap - EXIT

          # Converge the running Redis onto the CI-owned command. This runs
          # after the rollout gate so the app's blip-tolerant healthcheck is
          # already live and the brief Redis restart cannot kill crawl tasks.
          redis_args() {
            docker service inspect "$REDIS_APPLICATION_APP_NAME" \
              --format '{{json .Spec.TaskTemplate.ContainerSpec.Command}} {{json .Spec.TaskTemplate.ContainerSpec.Args}}'
          }
          if ! redis_args | grep -q 'appendfsync","everysec'; then
            printf 'header = "x-api-key: %s"\n' "$DOKPLOY_API_KEY" | curl -fsS --connect-timeout 5 --max-time 15 --max-filesize 65536 --config - \
              -X POST "$DOKPLOY_URL/api/application.deploy" \
              -H 'content-type: application/json' \
              --data "$(printf '{"applicationId":"%s"}' "$REDIS_APPLICATION_ID")" >/dev/null
            # Dokploy applied the one observed convergence redeploy ~5m36s
            # after the POST (23:43:58 -> 23:49:34 on 2026-08-28), so a 300s
            # poll expires before a healthy apply lands. Give it 600s.
            for _ in {1..120}; do
              running="$(docker service ps "$REDIS_APPLICATION_APP_NAME" --filter desired-state=running --format '{{.CurrentState}}' | grep -c '^Running' || true)"
              if redis_args | grep -q 'appendfsync","everysec' && [ "$running" = "1" ]; then
                break
              fi
              sleep 5
            done
            if ! redis_args | grep -q 'appendfsync","everysec'; then
              echo "::error::Redis service command did not converge to appendfsync everysec within 600s; rendered command/args: $(redis_args)"
              exit 1
            fi
            python3 deploy/docker/readiness_routing.py verify
          fi
          echo "deploy verified for ${IMAGE}:${GITHUB_SHA} with $(wc -l < "$ROLLOUT_MONITOR_PATH") successful public probes"

      - name: Preserve rollout evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: crawl4ai-rollout-${{ github.sha }}
          path: ${{ runner.temp }}/crawl4ai-rollout-monitor.jsonl
          if-no-files-found: warn
